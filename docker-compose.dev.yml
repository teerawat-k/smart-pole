# Dev overlay — รัน infra เท่านั้น (mosquitto)
# Postgres ใช้ตัวที่ลง local บนเครื่อง (port 5432)
# ใช้: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mosquitto
# จากนั้น `bun dev` ใน backend/frontend (ต่อ Postgres + mqtt ผ่าน localhost:77xx)

name: smart-pole

services:
  mosquitto:
    ports:
      - '7783:1883'
      - '7791:9001'

  backend:
    profiles: ['app']

  frontend:
    profiles: ['app']
