# Dev overlay — รัน infra เท่านั้น (mosquitto + srs)
# Postgres ใช้ตัวที่ลง local บนเครื่อง (port 5432)
# ใช้: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mosquitto srs
# จากนั้น `bun dev` ใน backend/frontend (ต่อ Postgres localhost:5432)

name: smart-pole

services:
  mosquitto:
    ports:
      - '${MQTT_TCP_PORT:-7783}:1883'
      - '${MQTT_WS_PORT:-7791}:9001'

  srs:
    ports:
      - '${SRS_RTMP_PORT:-7735}:1935'
      - '${SRS_HLS_PORT:-7780}:8080'
      - '${SRS_API_PORT:-7785}:1985'

  backend:
    profiles: ['app']

  frontend:
    profiles: ['app']
