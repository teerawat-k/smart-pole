name: smart-pole

# หมายเหตุ: Postgres ไม่ได้อยู่ใน compose — ใช้ Postgres + TimescaleDB extension ที่ติดตั้ง local บนเครื่อง
# (ติดตั้ง: https://docs.timescale.com/self-hosted/latest/install/installation-windows/ หรือ pg_install_tsdb)
# DATABASE_URL ใน .env ต้องชี้ไป host:5432 — Linux/macOS: host.docker.internal, Windows Docker Desktop: host.docker.internal
# Backend container เข้า host Postgres ผ่าน host network gateway

services:
  # ─── Mosquitto MQTT 5 broker ───────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-pole-mosquitto
    restart: unless-stopped
    ports:
      - '${MQTT_TCP_PORT:-7783}:1883'    # TCP MQTT
      - '${MQTT_WS_PORT:-7791}:9001'     # WebSocket MQTT
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    environment:
      TZ: Asia/Bangkok
    networks:
      - smart-pole-network

  # ─── SRS streaming server (RTMP push → HLS + DVR) ──────────────────────────
  srs:
    image: ossrs/srs:5
    container_name: smart-pole-srs
    restart: unless-stopped
    ports:
      - '${SRS_RTMP_PORT:-7735}:1935'    # RTMP ingest
      - '${SRS_HLS_PORT:-7780}:8080'     # HLS playback
      - '${SRS_API_PORT:-7785}:1985'     # SRS HTTP API
    volumes:
      - ./infra/srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
      - ./data/recordings:/usr/local/srs/objs/nginx/html/recordings
    environment:
      TZ: Asia/Bangkok
    networks:
      - smart-pole-network

  # ─── Backend (Bun + Elysia) ────────────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME:-teerawatk}/smart-pole-backend:${IMAGE_TAG:-latest}
    container_name: smart-pole-backend
    restart: unless-stopped
    build:
      context: ./backend
    ports:
      - '${BACKEND_PORT:-7766}:7766'
    env_file:
      - .env
    environment:
      TZ: Asia/Bangkok
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 7766
      # DATABASE_URL ชี้ไป host Postgres — ใช้ host.docker.internal (Docker Desktop) หรือ extra_hosts
      DATABASE_URL: ${DATABASE_URL}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      SRS_HLS_BASE: http://srs:8080
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-7765}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/recordings:/app/data/recordings:ro
      - ./volumes/logs:/app/logs
    depends_on:
      mosquitto:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7766/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smart-pole-network
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
        compress: 'true'

  # ─── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME:-teerawatk}/smart-pole-frontend:${IMAGE_TAG:-latest}
    container_name: smart-pole-frontend
    restart: unless-stopped
    build:
      context: ./frontend
    ports:
      - '${FRONTEND_PORT:-7765}:7765'
    environment:
      TZ: Asia/Bangkok
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 7765
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7766}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:7766/ws}
      NEXT_PUBLIC_HLS_BASE: ${NEXT_PUBLIC_HLS_BASE:-http://localhost:7780}
      NEXT_PUBLIC_PROJECT_PREFIX: ${NEXT_PUBLIC_PROJECT_PREFIX:-smart-pole}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7765/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smart-pole-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  smart-pole-network:
    name: smart-pole-network
    driver: bridge
