# Local Windows dev config — ใช้แทน infra/mosquitto/config/mosquitto.conf
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ─── TCP MQTT ─────────────────────────────────────────────
listener 1883
protocol mqtt

# ─── WebSocket MQTT ───────────────────────────────────────
listener 9001
protocol websockets

# ─── Auth — dev allows anonymous ──────────────────────────
allow_anonymous true

# ─── MQTT 5 features ──────────────────────────────────────
max_keepalive 65535
max_packet_size 1048576
