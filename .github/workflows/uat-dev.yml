name: (UAT DEV) Smart Pole

on:
  push:
    branches:
      - "uat-dev"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: uat-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Detect changed paths ───────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "infra/**"
              - "docker-compose.yml"
              - ".github/workflows/uat-dev.yml"
            frontend:
              - "frontend/**"
              - "docker-compose.yml"
              - ".github/workflows/uat-dev.yml"

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'backend')
    runs-on: ubuntu-latest
    environment: uat_dev_site
    env:
      TZ: "Asia/Bangkok"
      IMAGE_TAG: "uat-dev"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discord Notification - Start
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔵 [$(date +'%Y-%m-%d %H:%M:%S')] 🚀 [BE] Build Started | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-${{ env.IMAGE_TAG }}
          cache-to: type=gha,mode=max,scope=backend-${{ env.IMAGE_TAG }}

      - name: Discord Notification - Deploying
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟣 [$(date +'%Y-%m-%d %H:%M:%S')] 📦 [BE] Deploying | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7    # pinned (was @master — broken intermittently 2026-06-16)
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml,infra/"
          target: "${{ secrets.COMPOSE_PATH }}"
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: Deploy to Server via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3    # pinned
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            export DEPLOY_DIR="${{ secrets.COMPOSE_PATH }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "📝 Creating .env file from secrets..."
            cat > .env << EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            BACKEND_PORT=${{ vars.BACKEND_PORT || 7766 }}
            FRONTEND_PORT=${{ vars.FRONTEND_PORT || 7765 }}
            EOF

            # Generate backend/.env from secrets ONLY if not exists
            # ป้องกัน CI overwrite manual rotation (JWT_SECRET, MQTT_PASSWORD ฯลฯ)
            # ถ้าอยาก force rewrite: ssh เข้า server ลบ backend/.env แล้ว rerun
            mkdir -p backend
            if [ ! -s backend/.env ]; then
              echo "📝 First-time: creating backend/.env from secrets..."
              cat > backend/.env << EOF
            NODE_ENV=production
            PORT=${{ vars.BACKEND_PORT || 7766 }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRES=${{ vars.JWT_ACCESS_EXPIRES || '15m' }}
            JWT_REFRESH_EXPIRES=${{ vars.JWT_REFRESH_EXPIRES || '7d' }}
            CORS_ORIGIN=${{ vars.CORS_ORIGIN }},https://152.42.242.162
            UPLOAD_DIR=data/uploads
            MQTT_BROKER_URL=${{ vars.MQTT_BROKER_URL || 'mqtt://mosquitto:1883' }}
            MQTT_USERNAME=${{ secrets.MQTT_USERNAME }}
            MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}
            MQTT_CLIENT_ID=smart-pole-backend-uat
            MQTT_TIMESTAMP_DRIFT_MAX_SEC=300
            POLE_OFFLINE_THRESHOLD_MINUTES=${{ vars.POLE_OFFLINE_THRESHOLD_MINUTES || 5 }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            EOF
            else
              echo "ℹ️  backend/.env exists ($(wc -l < backend/.env) lines) — preserving current values"
              echo "   (ถ้าอยาก reset: ssh + rm backend/.env แล้ว rerun deploy)"
              # Ensure non-secret defaults are up to date (ไม่ทับ secrets)
              grep -q '^NODE_ENV=' backend/.env || echo 'NODE_ENV=production' >> backend/.env
            fi

            echo "🔑 Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "🌐 Ensure docker network..."
            docker network create smart-pole-network 2>/dev/null || true

            echo "📂 Fixing permissions for volumes..."
            mkdir -p data/uploads data/mosquitto/data data/mosquitto/log
            chmod -R 777 data 2>/dev/null || true

            # ─── Mosquitto: ensure running + reload config ──────────────────
            # NOTE: UAT uses anonymous mode (mosquitto.conf: allow_anonymous true).
            # For production, generate passwordfile manually on the host.
            echo "🦟 Ensuring Mosquitto running..."
            docker compose up -d mosquitto
            docker compose kill -s HUP mosquitto 2>/dev/null || true   # reload conf without restart

            # ─── SRS: ensure running (RTMP ingest + HLS serve) ──────────────
            # Pi → rtmp://host:1935/live/<poleName>, Browser → http://host:8080/live/<poleName>.m3u8
            echo "📺 Ensuring SRS running..."
            docker compose up -d srs

            # ─── Backend: pull → migrate → restart ──────────────────────────
            echo "📥 Pulling latest backend image..."
            docker compose pull backend

            echo "🔄 Running Database Migrations..."
            docker compose run --rm -e DATABASE_URL="${{ secrets.DATABASE_URL }}" backend bunx prisma migrate deploy --config prisma/prisma.config.ts || true

            echo "🛑 Stopping old backend container..."
            docker rm -f smart-pole-backend 2>/dev/null || true

            echo "🚀 Restarting backend container..."
            docker compose up -d --force-recreate backend

            # ─── Health checks: backend + mosquitto ─────────────────────────
            echo "⏳ Health checks..."
            sleep 10
            curl -fsS http://localhost:${{ vars.BACKEND_PORT || 7766 }}/health/ready \
              || (docker compose logs backend --tail 80 && exit 1)

            # Use credentials from backend/.env (preserve manual rotation)
            # — กัน mismatch กรณี secrets ใน GitHub stale กว่า production
            MQTT_USER=$(grep '^MQTT_USERNAME=' backend/.env | cut -d= -f2-)
            MQTT_PASS=$(grep '^MQTT_PASSWORD=' backend/.env | cut -d= -f2-)
            if [ -n "$MQTT_USER" ] && [ -n "$MQTT_PASS" ]; then
              docker exec smart-pole-mosquitto mosquitto_sub -h localhost -p 1883 \
                -u "$MQTT_USER" -P "$MQTT_PASS" \
                -t '$SYS/broker/uptime' -C 1 -W 5 \
                || (echo "⚠️ Mosquitto auth check failed (creds in .env vs broker mismatch)"; \
                    docker compose logs mosquitto --tail 40; \
                    exit 1)
            else
              echo "⚠️ MQTT creds ใน backend/.env ว่าง — skip mosquitto verify"
            fi

            echo "🧹 Cleaning up unused images..."
            docker image prune -f

            echo "✅ Backend + Mosquitto deployment successful."

      - name: Discord Notification - Success
        continue-on-error: true
        if: success()
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟢 [$(date +'%Y-%m-%d %H:%M:%S')] ✅ [BE] Deploy Completed | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Get failure time
        if: failure()
        id: date_failure
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Discord Notification - Failure
        continue-on-error: true
        if: failure()
        run: |
          FAILED_STEP="${{ steps.docker_build.outcome == 'failure' && 'Docker Build' || steps.deploy.outcome == 'failure' && 'SSH Deploy' || 'Setup' }}"
          curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔴 [${{ steps.date_failure.outputs.date }}] ❌ [BE] Deploy Failed (${FAILED_STEP}) | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" ${{ secrets.DISCORD_WEBHOOK }}

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'frontend')
    runs-on: ubuntu-latest
    environment: uat_dev_site
    env:
      TZ: "Asia/Bangkok"
      IMAGE_TAG: "uat-dev"
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discord Notification - Start
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔵 [$(date +'%Y-%m-%d %H:%M:%S')] 🚀 [FE] Build Started | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-frontend:${{ env.IMAGE_TAG }}
          # Frontend ใช้ relative URL ผ่าน lib/runtime-url.ts (commit ed... ขึ้นไป)
          # → API/WS/HLS ใช้ origin ของ page ที่ user เข้ามา (HTTP port 7765 หรือ HTTPS nginx)
          # → ไม่ต้อง hardcode URL ที่ build time อีกต่อไป
          # ⚠️ ถ้า frontend host แยกจาก backend host ต้อง set NEXT_PUBLIC_API_URL ที่ build args
          build-args: |
            NEXT_PUBLIC_PROJECT_PREFIX=${{ vars.NEXT_PUBLIC_PROJECT_PREFIX || 'smart-pole-uat' }}
          cache-from: |
            type=gha,scope=frontend-${{ env.IMAGE_TAG }}
          cache-to: |
            type=gha,mode=max,scope=frontend-${{ env.IMAGE_TAG }}

      - name: Discord Notification - Deploying
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟣 [$(date +'%Y-%m-%d %H:%M:%S')] 📦 [FE] Deploying | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7    # pinned (was @master)
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml"
          target: "${{ secrets.COMPOSE_PATH }}"
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: Deploy to Server via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3    # pinned
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export FRONTEND_PORT="${{ vars.FRONTEND_PORT || 7765 }}"
            export DEPLOY_DIR="${{ secrets.COMPOSE_PATH }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # docker compose ต้องการ env_file ของทุก service — ถ้า backend job ยังไม่รัน
            # ต้อง stub ก่อน (frontend container ไม่ใช้ค่าใน backend/.env)
            mkdir -p backend
            [ ! -f backend/.env ] && touch backend/.env

            echo "🔑 Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "📥 Pulling latest frontend image..."
            docker compose pull frontend

            echo "🛑 Stopping old containers..."
            docker rm -f smart-pole-frontend 2>/dev/null || true

            echo "🔄 Restarting frontend container..."
            docker compose up -d --force-recreate frontend

            echo "⏳ Waiting for health check..."
            sleep 10

            echo "🧹 Cleaning up unused images..."
            docker image prune -f

            echo "✅ Frontend deployment successful."

      - name: Discord Notification - Success
        continue-on-error: true
        if: success()
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟢 [$(date +'%Y-%m-%d %H:%M:%S')] ✅ [FE] Deploy Completed | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Get failure time
        if: failure()
        id: date_failure
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Discord Notification - Failure
        continue-on-error: true
        if: failure()
        run: |
          FAILED_STEP="${{ steps.docker_build.outcome == 'failure' && 'Docker Build' || steps.deploy.outcome == 'failure' && 'SSH Deploy' || 'Setup' }}"
          curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔴 [${{ steps.date_failure.outputs.date }}] ❌ [FE] Deploy Failed (${FAILED_STEP}) | Smart-Pole | Tag: ${{ env.IMAGE_TAG }}\`\"}" ${{ secrets.DISCORD_WEBHOOK }}
