name: UAT-Dev · Build + Deploy

on:
  push:
    branches: [uat-dev]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-frontend
  IMAGE_TAG: uat-${{ github.sha }}

jobs:
  # ─── Quality gates (parallel) ────────────────────────────
  backend-check:
    name: Backend · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - working-directory: backend
        run: bun install --frozen-lockfile
      - working-directory: backend
        run: bunx prisma generate --config prisma/prisma.config.ts
      - working-directory: backend
        run: bunx tsc --noEmit
      - working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-for-tests
        run: bun test --pattern '*.service.test.ts'

  frontend-check:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: bunx tsc --noEmit

  # ─── Build + Push images ─────────────────────────────────
  build-and-push:
    name: Build & push Docker images
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:uat-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:uat-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.UAT_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.UAT_NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_HLS_BASE=${{ vars.UAT_NEXT_PUBLIC_HLS_BASE }}
            NEXT_PUBLIC_PROJECT_PREFIX=smart-pole-uat
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ─── Deploy to UAT host (SSH + docker compose) ──────────
  deploy-uat:
    name: Deploy → UAT
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: uat-dev
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to UAT host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "docker-compose.yml,infra/"
          target: "${{ secrets.UAT_DEPLOY_PATH }}"

      - name: Pull, migrate & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.UAT_DEPLOY_PATH }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=uat-latest
            docker network create smart-pole-network 2>/dev/null || true
            docker compose pull
            docker compose run --rm backend bunx prisma migrate deploy --config prisma/prisma.config.ts
            docker compose up -d --force-recreate
            sleep 10
            curl -fsS http://localhost:7766/health/ready || (docker compose logs backend --tail 50 && exit 1)
            docker compose ps
