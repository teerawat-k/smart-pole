name: (PRODUCTION) Smart Pole

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false   # production: don't cancel mid-deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "docker-compose.yml"
              - ".github/workflows/production.yml"
            frontend:
              - "frontend/**"
              - "docker-compose.yml"
              - ".github/workflows/production.yml"

  backend:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'backend')
    runs-on: ubuntu-latest
    environment: production   # ⚠️ ตั้ง required reviewers ใน GitHub Settings
    env:
      TZ: "Asia/Bangkok"
      IMAGE_TAG: "production"
    steps:
      - uses: actions/checkout@v4

      - name: Discord Notification - Start
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔵 [$(date +'%Y-%m-%d %H:%M:%S')] 🚀 [BE] Build Started | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-${{ env.IMAGE_TAG }}
          cache-to: type=gha,mode=max,scope=backend-${{ env.IMAGE_TAG }}

      - name: Discord Notification - Deploying
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟣 [$(date +'%Y-%m-%d %H:%M:%S')] 📦 [BE] Deploying | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Copy compose + infra to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml,infra/"
          target: "${{ secrets.COMPOSE_PATH }}"
          overwrite: true

      - name: Deploy to Server via SSH
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            cd ${{ secrets.COMPOSE_PATH }}

            echo "📝 Creating .env from secrets..."
            cat > .env << EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            BACKEND_PORT=${{ vars.BACKEND_PORT || 7766 }}
            FRONTEND_PORT=${{ vars.FRONTEND_PORT || 7765 }}
            EOF

            cat > backend/.env << EOF
            NODE_ENV=production
            PORT=${{ vars.BACKEND_PORT || 7766 }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRES=${{ vars.JWT_ACCESS_EXPIRES || '15m' }}
            JWT_REFRESH_EXPIRES=${{ vars.JWT_REFRESH_EXPIRES || '7d' }}
            CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
            UPLOAD_DIR=data/uploads
            RECORDINGS_DIR=data/recordings
            MQTT_BROKER_URL=${{ vars.MQTT_BROKER_URL || 'mqtt://mosquitto:1883' }}
            MQTT_USERNAME=${{ secrets.MQTT_USERNAME }}
            MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}
            MQTT_CLIENT_ID=smart-pole-backend-prod
            MQTT_TIMESTAMP_DRIFT_MAX_SEC=300
            POLE_OFFLINE_THRESHOLD_MINUTES=${{ vars.POLE_OFFLINE_THRESHOLD_MINUTES || 5 }}
            SRS_HLS_BASE=${{ vars.SRS_HLS_BASE || 'http://srs:8080' }}
            SRS_DVR_TOKEN=${{ secrets.SRS_DVR_TOKEN }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'warn' }}
            EOF

            echo "🔑 Docker login..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "🌐 Ensure network..."
            docker network create smart-pole-network 2>/dev/null || true

            echo "📂 Fixing volume permissions..."
            mkdir -p backups
            docker run --rm -v "$(pwd)/data:/data" alpine sh -c "mkdir -p /data/uploads /data/recordings /data/mosquitto/data /data/mosquitto/log && chmod -R 777 /data" || true

            # ─── Backup DB ก่อน migrate ──────────────────────────
            echo "💾 Backing up DB..."
            ts=$(date +%Y%m%d-%H%M%S)
            docker run --rm postgres:18-alpine pg_dump "${{ secrets.DATABASE_URL }}" 2>/dev/null | gzip > "backups/smart_pole_${ts}.sql.gz"

            # ─── Mosquitto password (idempotent) ────────────────
            mkdir -p infra/mosquitto/config
            docker run --rm -v "$(pwd)/infra/mosquitto/config:/mosquitto/config" \
              eclipse-mosquitto:2 mosquitto_passwd -b ${{ !hashFiles('infra/mosquitto/config/passwordfile') && '-c' || '' }} /mosquitto/config/passwordfile \
              "${{ secrets.MQTT_USERNAME }}" "${{ secrets.MQTT_PASSWORD }}" || \
              docker run --rm -v "$(pwd)/infra/mosquitto/config:/mosquitto/config" \
                eclipse-mosquitto:2 mosquitto_passwd -b -c /mosquitto/config/passwordfile \
                "${{ secrets.MQTT_USERNAME }}" "${{ secrets.MQTT_PASSWORD }}"

            # ─── Ensure Mosquitto + SRS running ─────────────────
            docker compose up -d mosquitto srs
            docker compose kill -s HUP mosquitto 2>/dev/null || true
            docker compose kill -s HUP srs 2>/dev/null || true

            # ─── Backend deploy ─────────────────────────────────
            docker compose pull backend
            docker compose run --rm -e DATABASE_URL="${{ secrets.DATABASE_URL }}" backend bunx prisma migrate deploy --config prisma/prisma.config.ts
            docker rm -f smart-pole-backend 2>/dev/null || true
            docker compose up -d --force-recreate backend

            # ─── Health checks ─────────────────────────────────
            sleep 15
            curl -fsS http://localhost:${{ vars.BACKEND_PORT || 7766 }}/health/ready \
              || (docker compose logs backend --tail 100 && exit 1)
            docker exec smart-pole-mosquitto mosquitto_sub -h localhost -p 1883 \
              -u "${{ secrets.MQTT_USERNAME }}" -P "${{ secrets.MQTT_PASSWORD }}" \
              -t '$SYS/broker/uptime' -C 1 -W 5 \
              || (docker compose logs mosquitto --tail 40 && exit 1)
            curl -fsS http://localhost:${{ vars.SRS_API_PORT || 7785 }}/api/v1/versions \
              || (docker compose logs srs --tail 40 && exit 1)

            docker image prune -f
            echo "✅ Production backend deployment successful."

      - name: Discord Notification - Success
        continue-on-error: true
        if: success()
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟢 [$(date +'%Y-%m-%d %H:%M:%S')] ✅ [BE] Deploy Completed | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Get failure time
        if: failure()
        id: date_failure
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Discord Notification - Failure
        continue-on-error: true
        if: failure()
        run: |
          FAILED_STEP="${{ steps.docker_build.outcome == 'failure' && 'Docker Build' || steps.deploy.outcome == 'failure' && 'SSH Deploy' || 'Setup' }}"
          curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔴 [${{ steps.date_failure.outputs.date }}] ❌ [BE] Deploy Failed (${FAILED_STEP}) | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" ${{ secrets.DISCORD_WEBHOOK }}

  frontend:
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'frontend')
    runs-on: ubuntu-latest
    environment: production
    env:
      TZ: "Asia/Bangkok"
      IMAGE_TAG: "production"
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Discord Notification - Start
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔵 [$(date +'%Y-%m-%d %H:%M:%S')] 🚀 [FE] Build Started | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_HLS_BASE=${{ vars.NEXT_PUBLIC_HLS_BASE }}
            NEXT_PUBLIC_PROJECT_PREFIX=${{ vars.NEXT_PUBLIC_PROJECT_PREFIX || 'smart-pole' }}
          cache-from: type=gha,scope=frontend-${{ env.IMAGE_TAG }}
          cache-to: type=gha,mode=max,scope=frontend-${{ env.IMAGE_TAG }}

      - name: Discord Notification - Deploying
        continue-on-error: true
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟣 [$(date +'%Y-%m-%d %H:%M:%S')] 📦 [FE] Deploying | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Deploy frontend via SSH
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            cd ${{ secrets.COMPOSE_PATH }}

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull frontend
            docker rm -f smart-pole-frontend 2>/dev/null || true
            docker compose up -d --force-recreate frontend
            sleep 10
            docker image prune -f

      - name: Discord Notification - Success
        continue-on-error: true
        if: success()
        run: |
          WH="${{ secrets.DISCORD_WEBHOOK }}"
          [[ "$WH" == https://* ]] && curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🟢 [$(date +'%Y-%m-%d %H:%M:%S')] ✅ [FE] Deploy Completed | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" "$WH" || echo "DISCORD_WEBHOOK not configured — skip"

      - name: Get failure time
        if: failure()
        id: date_failure
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Discord Notification - Failure
        continue-on-error: true
        if: failure()
        run: |
          FAILED_STEP="${{ steps.docker_build.outcome == 'failure' && 'Docker Build' || steps.deploy.outcome == 'failure' && 'SSH Deploy' || 'Setup' }}"
          curl -H "Content-Type: application/json" -d "{\"username\": \"Smart-Pole\", \"avatar_url\": \"https://cdn-icons-png.flaticon.com/512/5065/5065647.png\", \"content\": \"\`🔴 [${{ steps.date_failure.outputs.date }}] ❌ [FE] Deploy Failed (${FAILED_STEP}) | Smart-Pole PROD | Tag: ${{ env.IMAGE_TAG }}\`\"}" ${{ secrets.DISCORD_WEBHOOK }}
