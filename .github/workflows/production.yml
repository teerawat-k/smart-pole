name: Production · Build + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/smart-pole-frontend
  IMAGE_TAG: prod-${{ github.sha }}

jobs:
  backend-check:
    name: Backend · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - working-directory: backend
        run: bun install --frozen-lockfile
      - working-directory: backend
        run: bunx prisma generate --config prisma/prisma.config.ts
      - working-directory: backend
        run: bunx tsc --noEmit
      - working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-for-tests
        run: bun test --pattern '*.service.test.ts'

  frontend-check:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: bunx tsc --noEmit

  build-and-push:
    name: Build & push images
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:prod-latest
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:prod-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.PROD_NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_HLS_BASE=${{ secrets.PROD_NEXT_PUBLIC_HLS_BASE }}
            NEXT_PUBLIC_PROJECT_PREFIX=smart-pole
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,scope=frontend-prod,mode=max

  deploy:
    name: Deploy → Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # ⚠️ ตั้ง required reviewers ใน GitHub Settings
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.yml,infra/"
          target: "${{ secrets.PROD_DEPLOY_PATH }}"

      - name: Backup DB + migrate + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            # 1) Backup DB ก่อน migrate
            ts=$(date +%Y%m%d-%H%M%S)
            pg_dump "$DATABASE_URL" | gzip > "backups/smart_pole_${ts}.sql.gz"

            # 2) Pull new images
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=prod-latest
            docker network create smart-pole-network 2>/dev/null || true
            docker compose pull

            # 3) Migrate (idempotent — Prisma migrate deploy)
            docker compose run --rm backend bunx prisma migrate deploy --config prisma/prisma.config.ts

            # 4) Rolling restart + health check
            docker compose up -d --force-recreate
            sleep 15
            curl -fsS http://localhost:7766/health/ready || (docker compose logs backend --tail 100 && exit 1)
            docker compose ps
