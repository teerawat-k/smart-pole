name: CI · Typecheck + Test + Secret Scan

on:
  push:
    branches: [main, uat-dev]
  pull_request:
    branches: [main, uat-dev]

jobs:
  backend:
    name: Backend · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend
        run: bunx prisma generate --config prisma/prisma.config.ts

      - name: Typecheck
        working-directory: backend
        run: bunx tsc --noEmit

      - name: Unit tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-for-tests
        run: bun test --pattern '*.service.test.ts'

  frontend:
    name: Frontend · typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bunx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: bun run lint || true

  secret-scan:
    name: Secret leak scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
