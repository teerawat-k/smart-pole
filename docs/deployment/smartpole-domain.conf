# Smart Pole — domain server block (Cloudflare proxied → origin)
# www.thaiurbanconnect.com / thaiurbanconnect.com
#
# นี่คือ "สำเนา version-control" — ไฟล์ live อยู่ที่ host:
#   /etc/nginx/sites-available/smartpole-domain.conf → symlink ใน sites-enabled/
# วิธีติดตั้ง/setup ทั้งหมด: docs/deployment/domain-ssl-setup.md
#
# cert: Cloudflare Origin CA (smartpole-origin.*) — trusted โดย Cloudflare (Full strict)
# เพิ่มใหม่ ไม่แตะ smart-pole.conf (IP block) / wanasub.conf · ไม่มี default_server
# rollback: rm symlink + ไฟล์นี้ → nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.thaiurbanconnect.com thaiurbanconnect.com;

    ssl_certificate     /etc/nginx/ssl/smartpole-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/smartpole-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SmartPoleDomainSSL:10m;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    # mTLS — Authenticated Origin Pulls: origin รับเฉพาะ Cloudflare (บล็อก bypass ตรง IP)
    ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    access_log /var/log/nginx/smartpole-domain.access.log;
    error_log  /var/log/nginx/smartpole-domain.error.log;

    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /grafana/ {
        proxy_pass         http://127.0.0.1:7795;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_read_timeout 86400;
    }

    location /ws {
        proxy_pass         http://127.0.0.1:7766;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass       http://127.0.0.1:7766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /flv/ {
        proxy_pass         http://127.0.0.1:7780/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 86400;
    }

    location /hls/ {
        proxy_pass       http://127.0.0.1:7780/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location / {
        proxy_pass       http://127.0.0.1:7765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}

server {
    listen      80;
    listen      [::]:80;
    server_name www.thaiurbanconnect.com thaiurbanconnect.com;
    return      301 https://$host$request_uri;
}
