# Smart Pole — SRS 5 config
# RTMP ingest (from Pi/camera) → HLS playback (browser via hls.js)
#
# ⚠️ ปัจจุบัน: HLS-only mode — DVR + http_hooks ปิดอยู่
#   • DVR ปิด เพราะ pipeline ใช้ manual upload คลิป mp4 จาก Pi → DO (camera-clip filesystem browser)
#   • http_hooks ปิด เพราะ backend ยังไม่มี module srs/ (P1-3 ใน docs/production-readiness.md)
# เมื่อ implement P1-3: เปิด http_hooks กลับ + เปิด DVR ถ้าต้องการ archive อัตโนมัติ

listen              1935;
max_connections     200;
daemon              off;
srs_log_tank        console;
pid                 ./objs/srs.pid;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # ─── HLS (live playback) ──────────────────────────────
    hls {
        enabled         on;
        hls_fragment    4;
        hls_window      30;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
}
