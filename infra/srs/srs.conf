# Smart Pole — SRS 5 config
# RTMP push from Dahua IPC-HFW5442E-ZE → HLS playback + DVR mp4

listen              1935;
max_connections     200;
daemon              off;
srs_log_tank        console;
pid                 ./objs/srs.pid;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # ─── HLS (live playback) ──────────────────────────────
    hls {
        enabled         on;
        hls_fragment    4;
        hls_window      30;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }

    # ─── DVR (recording mp4) ──────────────────────────────
    dvr {
        enabled             on;
        dvr_path            ./objs/nginx/html/recordings/[stream]/[2006-01-02]/[15-04-05].mp4;
        dvr_plan            segment;
        dvr_duration        1800;
        dvr_wait_keyframe   on;
    }

    # ─── HTTP hooks (callback ไป backend) ─────────────────
    # backend จะรับ on_dvr → index VideoRecording (ทำใน E09.T03)
    http_hooks {
        enabled         on;
        on_publish      http://backend:7766/api/srs/on-publish;
        on_unpublish    http://backend:7766/api/srs/on-unpublish;
        on_dvr          http://backend:7766/api/srs/on-dvr;
    }
}
