# Smart Pole nginx server block
# Path บน host: /etc/nginx/sites-available/smart-pole.conf → symlink ใน sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

# ── HTTPS: TLS termination + reverse proxy ─────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # ตรง IP — เพื่อให้ override default_server ของ nginx
    # เปลี่ยนเป็น domain เมื่อมี (เช่น smartpole.your-domain.com)
    server_name 152.42.242.162;

    # ── Self-signed cert (gen ผ่าน setup-nginx.sh) ──
    # Upgrade Let's Encrypt: certbot --nginx -d smartpole.your-domain.com
    ssl_certificate     /etc/nginx/ssl/smart-pole.crt;
    ssl_certificate_key /etc/nginx/ssl/smart-pole.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SmartPoleSSL:10m;

    # ── Logging ──
    access_log /var/log/nginx/smart-pole.access.log;
    error_log  /var/log/nginx/smart-pole.error.log;

    # ── Body size (camera clip upload สูงสุด) ──
    client_max_body_size 50M;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Backend WebSocket ─────────────────────────────────────
    # เปิดก่อน /api/ เพื่อจับ upgrade header
    location /ws {
        proxy_pass         http://127.0.0.1:7766;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400;  # 24h — กัน WS idle disconnect
    }

    # ── Backend REST API ──────────────────────────────────────
    location /api/ {
        proxy_pass       http://127.0.0.1:7766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── HLS live streaming (SRS) ──────────────────────────────
    # Browser: /hls/live/<pole>.m3u8 → strip /hls/ → SRS port 7780
    location /hls/ {
        proxy_pass       http://127.0.0.1:7780/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HLS chunks ต้อง stream ไม่ buffer
        proxy_buffering off;
    }

    # ── Frontend (Next.js) catch-all ─────────────────────────
    location / {
        proxy_pass       http://127.0.0.1:7765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Next.js HMR (dev เท่านั้น — ไม่มีผลใน prod)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}

# ── HTTP → HTTPS redirect (เฉพาะ IP — wanasub keeps its own) ──
server {
    listen      80;
    listen      [::]:80;
    server_name 152.42.242.162;
    return      301 https://$server_name$request_uri;
}
