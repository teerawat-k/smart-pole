# Prometheus scrape config — internal docker network
# Reload (no restart): curl -X POST http://prometheus:9090/-/reload

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: smart-pole-uat
    environment: production

scrape_configs:
  # ── Backend (Elysia) — /metrics via prom-client ──
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:7766']
        labels:
          service: smart-pole-backend

  # ── Prometheus self-monitoring ──
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── SRS HTTP API summaries (future — needs json_exporter) ──
  # - job_name: srs
  #   metrics_path: /api/v1/summaries
