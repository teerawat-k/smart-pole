# Smart Pole — Mosquitto MQTT 5 broker config
# Dev: anonymous allowed (ลด friction); Production: ปิด + ใช้ password_file + acl_file

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ─── TCP MQTT ─────────────────────────────────────────────
listener 1883
protocol mqtt

# ─── WebSocket MQTT ───────────────────────────────────────
listener 9001
protocol websockets

# ─── Auth — enforced (hardened 2026-06-17) ────────────────
# Anonymous publish/subscribe ถูกปิด — ทุก client ต้องมี username/password
# Update passwordfile via:
#   docker run --rm -v ./infra/mosquitto/config:/conf eclipse-mosquitto:2 \
#     mosquitto_passwd -b /conf/passwordfile <username> <password>
# After update → chmod 644 + restart mosquitto container
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# ─── MQTT 5 features ──────────────────────────────────────
max_keepalive 65535
max_packet_size 1048576
