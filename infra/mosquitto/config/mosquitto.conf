# Smart Pole — Mosquitto MQTT 5 broker config
# Dev: anonymous allowed (ลด friction); Production: ปิด + ใช้ password_file + acl_file

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ─── TCP MQTT ─────────────────────────────────────────────
listener 1883
protocol mqtt

# ─── WebSocket MQTT ───────────────────────────────────────
listener 9001
protocol websockets

# ─── Auth — dev allows anonymous ──────────────────────────
# Production: เปลี่ยน allow_anonymous เป็น false + uncomment password/acl
allow_anonymous true
# password_file /mosquitto/config/passwordfile
# acl_file /mosquitto/config/aclfile

# ─── MQTT 5 features ──────────────────────────────────────
max_keepalive 65535
max_packet_size 1048576
